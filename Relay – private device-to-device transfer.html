<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexuli · private transfer</title>
  <style>
    /* modern techie aesthetic – no neon, no emoji, clean dark UI */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0e1117;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      color: #e6edf3;
      line-height: 1.5;
    }

    .app-container {
      max-width: 1080px;
      width: 100%;
      background: #161b22;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: 2rem 2.25rem;
      transition: all 0.2s ease;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      border-bottom: 1px solid #2d333b;
      padding-bottom: 1.25rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: #1f6feb;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(31, 111, 235, 0.25);
    }

    .logo-text {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0f6fc;
    }

    .status-badge {
      background: #21262d;
      padding: 0.5rem 1rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #30363d;
      color: #b1bac4;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 8px #3fb95080;
    }

    .status-dot.offline {
      background: #8b949e;
      box-shadow: none;
    }

    /* two-panel layout */
    .transfer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.75rem;
    }

    /* both panels */
    .panel {
      background: #0d1117;
      border-radius: 24px;
      border: 1px solid #2d333b;
      padding: 1.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.6);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f0f6fc;
      letter-spacing: -0.01em;
    }

    .peer-label {
      font-size: 0.8rem;
      background: #1c2128;
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      color: #8b949e;
      border: 1px solid #30363d;
    }

    .code-display {
      background: #1c2128;
      border-radius: 20px;
      padding: 0.75rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #30363d;
    }

    .code-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8b949e;
      font-weight: 500;
    }

    .code-value {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: #58a6ff;
      background: #0d1117;
      padding: 0.2rem 0.8rem;
      border-radius: 14px;
      border: 1px solid #1f6feb40;
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .input-group input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 0.9rem 1.25rem;
      font-size: 1rem;
      color: #f0f6fc;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
      font-weight: 400;
    }

    .input-group input:focus {
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.2);
    }

    .input-group input::placeholder {
      color: #6e7681;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 0.9rem 1.6rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      white-space: nowrap;
    }

    .btn-primary {
      background: #1f6feb;
      border: 1px solid #388bfd;
      color: white;
      box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
    }

    .btn-primary:hover {
      background: #2d7ff9;
      border-color: #58a6ff;
    }

    .btn-secondary:hover {
      background: #2d333b;
      border-color: #8b949e;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid #30363d;
      color: #b1bac4;
    }

    .btn-ghost:hover {
      background: #1c2128;
      border-color: #8b949e;
    }

    /* drop zone */
    .drop-zone {
      border: 2px dashed #30363d;
      background: #0d1117;
      border-radius: 20px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border 0.15s, background 0.15s;
      margin-bottom: 1.25rem;
      color: #8b949e;
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #1f6feb;
      background: #1c2128;
      color: #c9d1d9;
    }

    .drop-zone .icon {
      font-size: 1.8rem;
      opacity: 0.7;
      font-weight: 300;
    }

    /* file list */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
      border: 1px solid #2d333b;
      animation: fadeSlide 0.15s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .file-name {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e6edf3;
    }

    .file-size {
      color: #8b949e;
      font-size: 0.75rem;
      margin-left: 6px;
    }

    .remove-file {
      background: transparent;
      border: none;
      color: #6e7681;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    .remove-file:hover {
      color: #f85149;
    }

    .transfer-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .received-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
    }

    .received-item {
      background: #0d1117;
      border: 1px solid #23863680;
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #b1bac4;
    }

    .received-item .file-name {
      color: #7ee787;
    }

    .badge-secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      background: #21262d;
      padding: 0.2rem 0.7rem;
      border-radius: 100px;
      color: #8b949e;
    }

    .badge-secure span {
      color: #3fb950;
      font-weight: 600;
    }

    .footer-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #6e7681;
      border-top: 1px solid #2d333b;
      padding-top: 1.25rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    /* scrollbar minimal */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1117;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d333b;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b434b;
    }

    /* responsive */
    @media (max-width: 760px) {
      .app-container { padding: 1.5rem 1.25rem; }
      .transfer-grid { grid-template-columns: 1fr; gap: 1.25rem; }
      .code-value { font-size: 1.6rem; letter-spacing: 4px; }
      .header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- header -->
    <div class="header">
      <div class="logo">
        <div class="logo-mark">V</div>
        <div class="logo-text">vexuli</div>
      </div>
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">awaiting connection</span>
      </div>
    </div>

    <!-- main two panels -->
    <div class="transfer-grid">
      <!-- LEFT PANEL – HOST / SENDER -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">send</div>
          <div class="peer-label">you · host</div>
        </div>

        <!-- 4-digit code area (generated) -->
        <div class="code-display">
          <span class="code-label">your code</span>
          <span class="code-value" id="hostCodeDisplay">–––</span>
        </div>

        <!-- generate / reset code -->
        <div style="display: flex; gap: 8px; margin-bottom: 1.5rem;">
          <button class="btn btn-secondary" id="generateCodeBtn" style="flex:1;">generate new code</button>
        </div>

        <!-- drop zone -->
        <div class="drop-zone" id="dropZone">
          <div class="icon">＋</div>
          <div>click or drop files</div>
          <div style="font-size:0.75rem; color:#6e7681;">photos, docs, any file</div>
        </div>
        <input type="file" id="fileInput" multiple hidden>

        <!-- selected files list -->
        <div class="file-list" id="selectedFilesList">
          <!-- dynamic file items -->
        </div>

        <!-- send button (only active with files & code) -->
        <div class="transfer-actions">
          <button class="btn btn-primary" id="sendBtn" style="flex:1;" disabled>send files</button>
        </div>

        <!-- subtle hint -->
        <div style="margin-top: 1rem; font-size: 0.75rem; color:#6e7681; text-align: center;">
          <span class="badge-secure">🔒 <span>4‑digit</span> · peer‑to‑peer</span>
        </div>
      </div>

      <!-- RIGHT PANEL – RECEIVER / JOIN -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">receive</div>
          <div class="peer-label">peer · join</div>
        </div>

        <!-- join with code -->
        <div class="input-group">
          <input type="text" id="joinCodeInput" placeholder="enter 4‑digit code" maxlength="4" inputmode="numeric" pattern="\d*">
          <button class="btn btn-secondary" id="joinBtn" style="padding-left:1.2rem; padding-right:1.2rem;">connect</button>
        </div>

        <!-- received files list -->
        <div style="margin-top: 0.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span style="font-size: 0.85rem; color: #8b949e;">incoming files</span>
            <span class="badge-secure">secure</span>
          </div>
          <div class="received-list" id="receivedList">
            <div style="font-size:0.85rem; color:#6e7681; padding:0.5rem 0;">no files yet</div>
          </div>
        </div>

        <!-- simulated transfer status -->
        <div style="margin-top: 1rem; font-size: 0.8rem; color: #8b949e; display: flex; justify-content: space-between;">
          <span id="connectionInfo">not connected</span>
          <span id="transferStatus"></span>
        </div>

        <!-- hint: only two peers -->
        <div style="margin-top: 1.5rem; font-size: 0.75rem; color: #6e7681; text-align: right;">
          only one peer can join per code
        </div>
      </div>
    </div>

    <!-- footer -->
    <div class="footer-note">
      <span>vexuli · private device‑to‑device</span>
      <span>no cloud storage</span>
      <span>e2e session</span>
    </div>
  </div>

  <script>
    (function() {
      // ---------- STATE ----------
      let hostCode = null;                // 4-digit string
      let selectedFiles = [];            // File objects
      let receivedFiles = [];            // { name, size, type }
      let isConnected = false;           // simulated connection state
      let peerConnectedCode = null;      // code that receiver used

      // DOM elements
      const hostCodeDisplay = document.getElementById('hostCodeDisplay');
      const generateCodeBtn = document.getElementById('generateCodeBtn');
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const selectedFilesList = document.getElementById('selectedFilesList');
      const sendBtn = document.getElementById('sendBtn');
      const joinCodeInput = document.getElementById('joinCodeInput');
      const joinBtn = document.getElementById('joinBtn');
      const receivedList = document.getElementById('receivedList');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const connectionInfo = document.getElementById('connectionInfo');
      const transferStatus = document.getElementById('transferStatus');

      // ---------- UTILS ----------
      function generate4DigitCode() {
        return Math.floor(1000 + Math.random() * 9000).toString();
      }

      function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }

      // ---------- UI UPDATES ----------
      function updateHostCodeUI() {
        if (hostCode) {
          hostCodeDisplay.textContent = hostCode;
          hostCodeDisplay.style.color = '#58a6ff';
        } else {
          hostCodeDisplay.textContent = '–––';
          hostCodeDisplay.style.color = '#6e7681';
        }
      }

      function renderSelectedFiles() {
        if (selectedFiles.length === 0) {
          selectedFilesList.innerHTML = '';
          sendBtn.disabled = true;
          return;
        }

        selectedFilesList.innerHTML = '';
        selectedFiles.forEach((file, index) => {
          const div = document.createElement('div');
          div.className = 'file-item';
          div.innerHTML = `
            <div class="file-name">
              <span style="opacity:0.7;">📄</span>
              <span>${file.name.length > 28 ? file.name.substring(0, 25) + '…' : file.name}</span>
              <span class="file-size">${formatFileSize(file.size)}</span>
            </div>
            <button class="remove-file" data-index="${index}" title="remove">✕</button>
          `;
          selectedFilesList.appendChild(div);
        });

        // attach remove listeners
        document.querySelectorAll('.remove-file').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.target.getAttribute('data-index'), 10);
            selectedFiles.splice(idx, 1);
            renderSelectedFiles();
            updateSendButtonState();
          });
        });

        updateSendButtonState();
      }

      function updateSendButtonState() {
        const hasCode = !!hostCode && hostCode.length === 4;
        const hasFiles = selectedFiles.length > 0;
        const connected = isConnected || false;

        // send button active only if code exists, files selected and (simulated) connected or not?
        // for a real p2p we need a connected peer. We'll simulate: enabled only if code exists and files >0 and peerConnected
        // also we show note: in real deployment you'd wait for peer. we'll make it active if code exists and files >0 and peer joined (isConnected)
        sendBtn.disabled = !(hasCode && hasFiles && isConnected);
        if (!isConnected && hasFiles && hasCode) {
          sendBtn.disabled = true;
          // but we can show a hint
        }
      }

      function updateConnectionStatusUI() {
        if (isConnected) {
          statusDot.className = 'status-dot';
          statusText.textContent = 'peer connected';
          connectionInfo.textContent = `connected · code ${peerConnectedCode || '—'}`;
        } else {
          statusDot.className = 'status-dot offline';
          statusText.textContent = 'awaiting connection';
          connectionInfo.textContent = 'not connected';
        }
        updateSendButtonState();
      }

      function updateReceivedListUI() {
        if (receivedFiles.length === 0) {
          receivedList.innerHTML = '<div style="font-size:0.85rem; color:#6e7681; padding:0.5rem 0;">no files yet</div>';
          return;
        }
        receivedList.innerHTML = '';
        receivedFiles.forEach((f, i) => {
          const div = document.createElement('div');
          div.className = 'received-item';
          div.innerHTML = `
            <div class="file-name">
              <span style="opacity:0.8;">📎</span>
              ${f.name.length > 28 ? f.name.substring(0, 25) + '…' : f.name}
              <span class="file-size">${formatFileSize(f.size)}</span>
            </div>
            <span style="color:#3fb950; font-size:0.7rem;">received</span>
          `;
          receivedList.appendChild(div);
        });
      }

      // ---------- FILE HANDLING ----------
      function addFiles(fileList) {
        const newFiles = Array.from(fileList);
        if (newFiles.length === 0) return;

        // avoid duplicates by name+size (simple)
        const existing = new Set(selectedFiles.map(f => f.name + '_' + f.size));
        newFiles.forEach(f => {
          if (!existing.has(f.name + '_' + f.size)) {
            selectedFiles.push(f);
            existing.add(f.name + '_' + f.size);
          }
        });
        renderSelectedFiles();
        updateSendButtonState();
      }

      // drag & drop
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) addFiles(e.target.files);
        fileInput.value = '';
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
      });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
      });

      // ---------- CODE GENERATION ----------
      function generateNewCode() {
        // reset connection on new code
        isConnected = false;
        peerConnectedCode = null;
        hostCode = generate4DigitCode();
        updateHostCodeUI();
        updateConnectionStatusUI();
        // if there are selected files, send button becomes disabled because not connected
        updateSendButtonState();
        // Optionally: disconnect any active peer
        // clear status text
        transferStatus.textContent = '';
      }

      generateCodeBtn.addEventListener('click', () => {
        generateNewCode();
      });

      // ---------- JOIN (RECEIVER SIDE) ----------
      joinBtn.addEventListener('click', () => {
        const entered = joinCodeInput.value.trim();
        if (!/^\d{4}$/.test(entered)) {
          alert('Please enter a valid 4‑digit code.');
          return;
        }
        if (!hostCode) {
          alert('No active code. Generate a code on the host side first.');
          return;
        }
        if (entered !== hostCode) {
          alert('Invalid code. Make sure you entered the correct 4‑digit code from the host.');
          return;
        }

        // simulate successful peer connection
        isConnected = true;
        peerConnectedCode = hostCode;
        updateConnectionStatusUI();
        updateSendButtonState();
        transferStatus.textContent = 'peer joined';

        // also show a note that only one peer can join (we simulate single connection)
        // disable join button to prevent another join (third‑party interference)
        joinBtn.disabled = true;
        joinCodeInput.disabled = true;
        // style disabled
        joinBtn.style.opacity = '0.6';
        joinCodeInput.style.opacity = '0.6';

        // add a system message in received area? no, wait for files.
      });

      // disable join if already connected? (third party prevention)
      // we do that in joinBtn handler after connection, also reset on new code.
      // but we also need to re-enable when new code is generated:
      // in generateNewCode, reset the join fields
      // we'll wrap generateNewCode to reset join UI
      const originalGenerate = generateNewCode;
      generateNewCode = function() {
        originalGenerate.call(this);
        // reset join fields
        joinCodeInput.disabled = false;
        joinBtn.disabled = false;
        joinBtn.style.opacity = '1';
        joinCodeInput.style.opacity = '1';
        joinCodeInput.value = '';
        // reset received files? we keep them, but clear connection state
        // but if we reset connection, we should also clear transferStatus
        transferStatus.textContent = '';
        // Also make sure isConnected false and peerConnectedCode null already done.
        // We also reset received files? not necessary, but for clarity we keep them.
        // However user might want to start fresh; we'll leave received list.
        // Also if send button was active, now disabled.
        updateSendButtonState();
      };

      // replace event listener to use new generateNewCode
      generateCodeBtn.removeEventListener('click', generateNewCode); // careful: we reassigned
      // Actually we need to rebind. Simpler: just override the click handler.
      // Let's remove and re-add with the new function.
      // But we already have a listener. We'll just replace it:
      generateCodeBtn.onclick = function() {
        generateNewCode();
      };

      // ---------- SEND FILES (simulate peer‑to‑peer transfer) ----------
      sendBtn.addEventListener('click', () => {
        if (!isConnected) {
          alert('No peer connected. Share your code and wait for the other device to join.');
          return;
        }
        if (!hostCode) {
          alert('Generate a code first.');
          return;
        }
        if (selectedFiles.length === 0) {
          alert('Select at least one file.');
          return;
        }

        // Simulate sending: copy file metadata to receivedFiles on the other panel
        // In a real implementation, you would use WebRTC data channels + signalling.
        const newReceived = selectedFiles.map(f => ({
          name: f.name,
          size: f.size,
          type: f.type || 'unknown'
        }));

        // Append to received list (simulate receiving on the other device)
        receivedFiles = receivedFiles.concat(newReceived);
        updateReceivedListUI();

        // Clear selected files after sending
        selectedFiles = [];
        renderSelectedFiles();
        updateSendButtonState();

        // Show status
        transferStatus.textContent = `${newReceived.length} file(s) sent · secure`;
        setTimeout(() => {
          if (transferStatus.textContent.includes('sent')) {
            transferStatus.textContent = '';
          }
        }, 4000);

        // Note: in real life, we would need a persistent connection. This is a simulation.
      });

      // ---------- INITIALIZATION ----------
      function init() {
        // generate initial code
        hostCode = generate4DigitCode();
        updateHostCodeUI();
        isConnected = false;
        peerConnectedCode = null;
        updateConnectionStatusUI();
        renderSelectedFiles();
        updateReceivedListUI();

        // ensure join fields enabled
        joinCodeInput.disabled = false;
        joinBtn.disabled = false;
        joinBtn.style.opacity = '1';
        joinCodeInput.style.opacity = '1';

        // Limit input to digits only
        joinCodeInput.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });
      }

      init();

      // also, when connection is lost or code regenerated, we should reset.
      // We'll also disable send button if not connected.
      // Override updateSendButtonState to include connection requirement
      const originalUpdateSend = updateSendButtonState;
      updateSendButtonState = function() {
        const hasCode = !!hostCode && hostCode.length === 4;
        const hasFiles = selectedFiles.length > 0;
        // Send button enabled only if connected (simulated) and has code and files
        sendBtn.disabled = !(hasCode && hasFiles && isConnected);
      };

      // Ensure generateNewCode resets connection and disables send
      // We'll patch generateNewCode again to also reset join fields and disable send.
      // The previous override already does most. Let's ensure it sets isConnected = false, etc.
      // We'll rewrite the override to be safe.
      const baseGenerate = function() {
        isConnected = false;
        peerConnectedCode = null;
        hostCode = generate4DigitCode();
        updateHostCodeUI();
        updateConnectionStatusUI();
        // reset join fields
        joinCodeInput.disabled = false;
        joinBtn.disabled = false;
        joinBtn.style.opacity = '1';
        joinCodeInput.style.opacity = '1';
        joinCodeInput.value = '';
        transferStatus.textContent = '';
        // disable send
        updateSendButtonState();
        // also we should remove all received files? Not necessarily, but to be clean we clear received list? Let's keep them for record but reset connection.
        // Actually, better to clear received list when new code is generated, to avoid confusion.
        receivedFiles = [];
        updateReceivedListUI();
      };

      // Bind generateNewCode to baseGenerate
      generateNewCode = baseGenerate;
      // Rebind button
      generateCodeBtn.onclick = function() {
        generateNewCode();
      };

      // Also when joining, we disable join controls
      // that part is already in joinBtn listener. We also need to make sure that if connection is active, no third party can join.
      // already disabled.

      // Ensure that after join success, send button becomes enabled if there are files and code.
      // We'll also make updateSendButtonState use isConnected.
      // We already do that above by overriding. But let's set final version.
      updateSendButtonState = function() {
        const hasCode = !!hostCode && hostCode.length === 4;
        const hasFiles = selectedFiles.length > 0;
        sendBtn.disabled = !(hasCode && hasFiles && isConnected);
      };

      // patch updateConnectionStatusUI to call updateSendButtonState
      const origUpdateConn = updateConnectionStatusUI;
      updateConnectionStatusUI = function() {
        origUpdateConn.call(this);
        updateSendButtonState();
      };

      // initialize everything again to be safe
      // (re-run init but keep hostCode? we call init again)
      // We'll just re-run some parts:
      // reset state
      hostCode = generate4DigitCode();
      isConnected = false;
      peerConnectedCode = null;
      selectedFiles = [];
      receivedFiles = [];
      updateHostCodeUI();
      updateConnectionStatusUI();
      renderSelectedFiles();
      updateReceivedListUI();
      joinCodeInput.disabled = false;
      joinBtn.disabled = false;
      joinBtn.style.opacity = '1';
      joinCodeInput.style.opacity = '1';
      joinCodeInput.value = '';
      transferStatus.textContent = '';
      generateCodeBtn.onclick = function() { generateNewCode(); };
      joinBtn.onclick = function() {
        const entered = joinCodeInput.value.trim();
        if (!/^\d{4}$/.test(entered)) {
          alert('Please enter a valid 4‑digit code.');
          return;
        }
        if (!hostCode) {
          alert('No active code. Generate a code on the host side first.');
          return;
        }
        if (entered !== hostCode) {
          alert('Invalid code. Make sure you entered the correct 4‑digit code from the host.');
          return;
        }
        // simulate connection
        isConnected = true;
        peerConnectedCode = hostCode;
        updateConnectionStatusUI();
        updateSendButtonState();
        transferStatus.textContent = 'peer joined';
        joinBtn.disabled = true;
        joinCodeInput.disabled = true;
        joinBtn.style.opacity = '0.6';
        joinCodeInput.style.opacity = '0.6';
      };

      // sendBtn.onclick re-assign to avoid multiple listeners
      sendBtn.onclick = function() {
        if (!isConnected) {
          alert('No peer connected. Share your code and wait for the other device to join.');
          return;
        }
        if (selectedFiles.length === 0) {
          alert('Select at least one file.');
          return;
        }
        const newReceived = selectedFiles.map(f => ({
          name: f.name,
          size: f.size,
          type: f.type || 'unknown'
        }));
        receivedFiles = receivedFiles.concat(newReceived);
        updateReceivedListUI();
        const count = selectedFiles.length;
        selectedFiles = [];
        renderSelectedFiles();
        updateSendButtonState();
        transferStatus.textContent = `${count} file(s) sent · secure`;
        setTimeout(() => {
          if (transferStatus.textContent.includes('sent')) {
            transferStatus.textContent = '';
          }
        }, 3000);
      };

      // re-bind file handling to avoid duplicates
      // we can leave the event listeners, but to avoid double we'll re-attach via new function? 
      // We already have event listeners from earlier; but we redefined some functions, still fine.
      // However, we must ensure that the dropZone and fileInput listeners are still active.
      // We'll just keep them as is; they reference addFiles which is still fine.

      // But we re-declared addFiles? No, it's still the same function. Fine.
      // Ensure generateNewCode resets join fields – we did.

      // Also ensure that when generating new code, we reset the send button and connection.
      // already in baseGenerate.

      // Final fix: generateCodeBtn calls generateNewCode which is now baseGenerate.
      // Also update host code after init.
      // re-run init of code
      hostCode = generate4DigitCode();
      updateHostCodeUI();
      updateConnectionStatusUI();
      renderSelectedFiles();
      updateReceivedListUI();

      // update join click with new handler
      // also ensure joinCodeInput only digits
      joinCodeInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      });

      // final: ensure send button disabled initially if not connected
      updateSendButtonState();

      // Add a note: only one peer, so after connection we lock join.
      // If a third party tries to join, the join button is disabled.
      // Edge: if host regenerates code, join is re-enabled and connection lost.
      // That's fine.
    })();
  </script>
</body>
