services:
  - type: web
    name: vexuli
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false